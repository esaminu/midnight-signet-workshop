# The Midnight wasm packages and the Compact compiler (COMPACT_PATH=node_modules)
# need a real node_modules tree, so no Plug'n'Play.
nodeLinker: node-modules

enableTelemetry: false

# All dependencies ship prebuilt binaries.
enableScripts: false

# @sig-net packages are first-party: install fresh publishes immediately.
npmPreapprovedPackages:
  - "@sig-net/*"
